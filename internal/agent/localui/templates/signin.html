<h1>Sign in</h1>
<p>On this node, as root or a member of group <code>meshctl</code>, run</p>
<pre>meshctl ui</pre>
<p>and open the link it prints within 2 minutes; it works once.</p>
<p class="hint">From another machine: <code>ssh -L 7443:127.0.0.1:7443</code> to this node, then open the link there.</p>
