<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>{{.Title}} - meshctl</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body{{if .CSRF}} hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'{{end}}>
<header>
<span class="brand">meshctl</span>
{{- if .User}}
<nav>
<a href="/"{{if eq .Nav "dashboard"}} class="active"{{end}}>Dashboard</a>
<a href="/nodes"{{if eq .Nav "nodes"}} class="active"{{end}}>Nodes</a>
<a href="/dns"{{if eq .Nav "dns"}} class="active"{{end}}>DNS</a>
<a href="/firewall"{{if eq .Nav "firewall"}} class="active"{{end}}>Firewall</a>
<a href="/versions"{{if eq .Nav "versions"}} class="active"{{end}}>Versions</a>
<a href="/audit"{{if eq .Nav "audit"}} class="active"{{end}}>Audit</a>
<a href="/settings"{{if eq .Nav "settings"}} class="active"{{end}}>Settings</a>
<a href="/users"{{if eq .Nav "users"}} class="active"{{end}}>Users</a>
<a href="/account"{{if eq .Nav "account"}} class="active"{{end}}>{{.User}}</a>
</nav>
<form method="post" action="/logout" class="inline">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button type="submit" class="link">Sign out</button>
</form>
{{- end}}
</header>
<main>
<h1>{{.Title}}</h1>
{{- if .Flash}}
<p class="flash">{{.Flash}}</p>
{{- end}}
{{- if .Error}}
<p class="error">{{.Error}}</p>
{{- end}}
{{template "content" .}}
</main>
<footer>meshctl {{.Version}}</footer>
</body>
</html>
