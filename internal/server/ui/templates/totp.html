{{define "content"}}
<form method="post" action="/login/totp" class="narrow">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>Code from your authenticator app <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label>
<button type="submit">Continue</button>
</form>
{{end}}
