{{define "content"}}
<h2>Change your password</h2>
<p>This signs you out everywhere.</p>
<form method="post" action="/account/password" class="narrow">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
<label>New password <input name="new" type="password" minlength="12" required autocomplete="new-password"></label>
<label>Repeat <input name="new2" type="password" minlength="12" required autocomplete="new-password"></label>
<button type="submit">Change password</button>
</form>
{{end}}
