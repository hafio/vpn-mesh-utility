# meshctl server as a Docker Swarm stack, for the 1.0.0-rc.2 live test.
#
#   docker node update --label-add meshctl.server=true <node with the rc image>   # once
#   export MESHCTL_TRUSTED_PROXIES=$(docker network inspect dokploy-network \
#     --format '{{range .IPAM.Config}}{{.Subnet}},{{end}}' | sed 's/,$//')
#   docker stack config -c stack.server.yml > /dev/null     # checks the file, deploys nothing
#   docker stack deploy --resolve-image never -c stack.server.yml vpn-mesh-test
#
# Or a Dokploy "Stack" app named vpn-mesh-test with MESHCTL_TRUSTED_PROXIES in its
# environment. Same posture as deploy/compose.server.yml, on port 28080. What Swarm
# changes:
#   - no container_name: the task's container is vpn-mesh-test_meshctl.1.<id>
#   - no security_opt and no pids limit, which a stack file cannot set; the
#     server runs as 65532 with every capability dropped in a distroless image
#     with no setuid binaries, so there is nothing to escalate through
#   - exactly one task, stopped before a new one starts: SQLite has one writer
#     and the server holds a lock on /data
#   - pinned by a node label, not just to a manager: the data volume is local
#     to one node (and the rc image is loaded there); another manager would
#     start the server on an empty volume
#   - --trusted-proxies is Traefik's network, so the server sees the client's
#     address in X-Forwarded-For (join rate limits and sign-in lockout are per
#     client); empty trusts nobody and every client looks like Traefik
services:
  meshctl:
    image: ghcr.io/hafio/vpn-mesh-utility:1.0.0-rc.2
    command:
      - server
      - --data
      - /data
      - --listen
      - ":28080"
      - --url
      - https://mesh.hafio.services
      - --trusted-proxies
      - ${MESHCTL_TRUSTED_PROXIES:-}
    user: "65532:65532"
    cap_drop: [ALL]
    read_only: true
    volumes:
      - meshctl-data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    networks: [dokploy-network]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/app/meshctl", "healthcheck", "server", "--addr", "127.0.0.1:28080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.meshctl.server == true]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 256M
      labels:
        # Dokploy's domain settings add the same; these serve a plain
        # `docker stack deploy`.
        - traefik.enable=true
        - traefik.http.routers.vpn-mesh-test.rule=Host(`mesh.hafio.services`)
        - traefik.http.routers.vpn-mesh-test.entrypoints=websecure
        - traefik.http.routers.vpn-mesh-test.tls.certresolver=letsencrypt
        - traefik.http.services.vpn-mesh-test.loadbalancer.server.port=28080

volumes:
  meshctl-data: {}

networks:
  dokploy-network:
    external: true
